apiVersion: apps/v1
kind: Deployment

metadata:
  name: ai-platform

spec:
  replicas: 1

  selector:
    matchLabels:
      app: ai-platform

  template:
    metadata:
      labels:
        app: ai-platform

    spec:
      containers:
        - name: ai-api
          image: 803109508817.dkr.ecr.ap-southeast-1.amazonaws.com/enterprise-ai-platform:v1
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8000
              name: http

          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 20
